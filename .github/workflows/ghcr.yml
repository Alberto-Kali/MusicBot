name: Ocuspot GHCR images

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No declared Docker images
        run: echo "No root Dockerfile or compose service Dockerfiles declared by Ocuspot."
