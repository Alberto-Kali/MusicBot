stages:
  - verify
  - build
  - sync
  - deploy

verify-container-contract:
  stage: verify
  image: alpine:latest
  script:
    - |
      set -e
      echo "Ocuspot project contract: container-first."
      echo "Runtime: docker-compose"
      if [ -f Dockerfile ]; then
        echo "Dockerfile detected: built-in image build/deploy path available."
      else
        echo "No Dockerfile detected yet. Compose projects are supported when declared in .ocuspot/ocuspot.yaml."
      fi
      if [ -f docker-compose.yml ] || [ -f docker-compose.yaml ] || [ -f compose.yml ] || [ -f compose.yaml ]; then
        echo "Compose file detected."
      fi
      test -f "docker-compose.yml"

validate-compose:
  stage: verify
  image: docker/compose:1.29.2
  rules:
    - exists:
        - docker-compose.yml
        - docker-compose.yaml
        - compose.yml
        - compose.yaml
  script:
    - |
      set -e
      COMPOSE_FILE=""
      for f in docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
        if [ -f "$f" ]; then COMPOSE_FILE="$f"; break; fi
      done
      test -n "$COMPOSE_FILE"
      COMPOSE_DIR="$(dirname "$COMPOSE_FILE")"
      awk '
        function emit(line) {
          sub(/[[:space:]]*#.*/, "", line)
          gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", line)
          if (line != "") print line
        }
        /^[[:space:]]*env_file:[[:space:]]*$/ {
          in_env = 1
          base = match($0, /[^[:space:]]/) - 1
          next
        }
        in_env {
          if ($0 ~ /^[[:space:]]*-/) {
            line = $0
            sub(/^[[:space:]]*-[[:space:]]*/, "", line)
            emit(line)
            next
          }
          if ($0 ~ /^[[:space:]]*$/ || $0 ~ /^[[:space:]]*#/) next
          indent = match($0, /[^[:space:]]/) - 1
          if (indent <= base) in_env = 0
        }
        /^[[:space:]]*env_file:[[:space:]]*[^#[:space:]]/ {
          line = $0
          sub(/^[[:space:]]*env_file:[[:space:]]*/, "", line)
          emit(line)
        }
      ' "$COMPOSE_FILE" | sort -u | while IFS= read -r env_file; do
        case "$env_file" in ""|/*|*..*|*\$*) continue ;; esac
        target="${COMPOSE_DIR}/${env_file}"
        if [ ! -f "$target" ]; then
          if [ -f "${target}.example" ]; then
            cp "${target}.example" "$target"
          else
            mkdir -p "$(dirname "$target")"
            touch "$target"
          fi
          echo "Created temporary compose env_file placeholder: ${env_file}"
        fi
      done
      docker-compose -f "$COMPOSE_FILE" config -q

build-image:
  stage: build
  image: docker:stable
  services:
    - docker:dind
  rules:
    - exists:
        - Dockerfile
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker save "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -o ocuspot-image.tar
  artifacts:
    expire_in: 1 day
    paths:
      - ocuspot-image.tar

build-compose-images:
  stage: build
  image: docker:stable
  services:
    - docker:dind
  rules:
    - exists:
        - docker-compose.yml
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

sync-github:
  stage: sync
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache git curl jq
  script:
    - |
      set -e
      git config user.email "${GITLAB_USER_EMAIL:-ocuspot-ci@users.noreply.gitlab.com}"
      git config user.name "${GITLAB_USER_NAME:-Ocuspot CI}"
      if ! git log -1 --pretty=%B | grep -F "Ocuspot-Mirror: gitlab-to-github" >/dev/null 2>&1; then
        git commit --amend --no-edit --trailer "Ocuspot-Mirror: gitlab-to-github" || true
      fi
      GITHUB_OWNER="Alberto-Kali"
      GITHUB_REPO="MusicBot"
      GITHUB_API="https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}"
      MIRROR_BRANCH="ocuspot/mirror/${CI_COMMIT_SHA}"
      MIRROR_HEAD="${GITHUB_OWNER}:${MIRROR_BRANCH}"
      git remote remove github 2>/dev/null || true
      git remote add github "https://oauth2:${OCUSPOT_GITHUB_TOKEN}@github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git"
      git push github HEAD:refs/heads/${MIRROR_BRANCH}
      PR_JSON="$(curl -fsS -H "Authorization: Bearer ${OCUSPOT_GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "${GITHUB_API}/pulls?head=${MIRROR_HEAD}&base=main&state=open")"
      PR_NUMBER="$(printf '%s' "$PR_JSON" | jq -r '.[0].number // empty')"
      if [ -z "$PR_NUMBER" ]; then
        PR_BODY="GitLab primary mirror for ${CI_PROJECT_PATH}@${CI_COMMIT_SHA}. Ocuspot waits for GitHub checks, then merges this PR so GHCR packages are built on GitHub."
        PR_CREATE="$(jq -n --arg title "sync(gitlab): ${CI_COMMIT_SHORT_SHA} -> GitHub" --arg head "$MIRROR_HEAD" --arg base "main" --arg body "$PR_BODY" '{title:$title, head:$head, base:$base, body:$body, maintainer_can_modify:true}')"
        PR_NUMBER="$(curl -fsS -X POST -H "Authorization: Bearer ${OCUSPOT_GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "${GITHUB_API}/pulls" -d "$PR_CREATE" | jq -r '.number')"
      fi
      echo "GitHub mirror PR #${PR_NUMBER} opened/updated for ${MIRROR_BRANCH}. Waiting for GitHub checks ..."
      for i in $(seq 1 80); do
        CHECKS="$(curl -fsS -H "Authorization: Bearer ${OCUSPOT_GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "${GITHUB_API}/commits/${CI_COMMIT_SHA}/check-runs" || printf '{"total_count":0,"check_runs":[]}')"
        TOTAL="$(printf '%s' "$CHECKS" | jq -r '.total_count // 0')"
        INCOMPLETE="$(printf '%s' "$CHECKS" | jq -r '[.check_runs[]? | select(.status != "completed")] | length')"
        BAD="$(printf '%s' "$CHECKS" | jq -r '[.check_runs[]? | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length')"
        STATUS="$(curl -fsS -H "Authorization: Bearer ${OCUSPOT_GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "${GITHUB_API}/commits/${CI_COMMIT_SHA}/status" || printf '{"state":"pending"}')"
        STATE="$(printf '%s' "$STATUS" | jq -r '.state // "pending"')"
        if [ "$BAD" != "0" ] || [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then echo "GitHub checks failed for ${CI_COMMIT_SHA}"; exit 1; fi
        if [ "$TOTAL" != "0" ] && [ "$INCOMPLETE" = "0" ] && { [ "$STATE" = "success" ] || [ "$STATE" = "pending" ]; }; then break; fi
        if [ "$i" = "80" ]; then echo "Timed out waiting for GitHub checks on ${CI_COMMIT_SHA}"; exit 1; fi
        sleep 15
      done
      MERGE_PAYLOAD="$(jq -n --arg sha "${CI_COMMIT_SHA}" '{commit_title:"sync(gitlab): mirror accepted GitLab primary", commit_message:"Merged by Ocuspot after GitHub checks passed.", sha:$sha, merge_method:"squash"}')"
      MERGED=0
      for i in $(seq 1 20); do
        if curl -fsS -X PUT -H "Authorization: Bearer ${OCUSPOT_GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "${GITHUB_API}/pulls/${PR_NUMBER}/merge" -d "$MERGE_PAYLOAD"; then MERGED=1; break; fi
        sleep 10
      done
      if [ "$MERGED" != "1" ]; then echo "GitHub PR #${PR_NUMBER} was not mergeable after checks. Review branch rules or required approvals."; exit 1; fi

deploy-carrier:
  stage: deploy
  image: alpine:latest
  needs:
    - job: build-compose-images
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      exists:
        - docker-compose.yml
  before_script:
    - apk add --no-cache ca-certificates curl jq openssh-client sshpass tar
    - test -n "$OCUSPOT_SSH_PRIVATE_KEY" || { test -n "$OCUSPOT_CARRIER_SSH_PASSWORD" && test -n "$OCUSPOT_GATEWAY_SSH_PASSWORD"; }
    - test -n "$OCUSPOT_GITLAB_TOKEN"
    - test -f .ocuspot/deploy/deploy.sh
    - test -f .ocuspot/deploy/publish-deployments.sh
    - mkdir -p ~/.ssh
    - |
      if [ -n "$OCUSPOT_SSH_PRIVATE_KEY" ]; then printf '%s\n' "$OCUSPOT_SSH_PRIVATE_KEY" > ~/.ssh/ocuspot_deploy_key && chmod 600 ~/.ssh/ocuspot_deploy_key && printf 'Host *\n IdentityFile ~/.ssh/ocuspot_deploy_key\n IdentitiesOnly yes\n StrictHostKeyChecking accept-new\n' > ~/.ssh/config; else printf 'Host *\n StrictHostKeyChecking accept-new\n' > ~/.ssh/config; fi
  script:
    - cd .ocuspot/deploy
    - sed "s|__OCUSPOT_IMAGE__|${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}|g" deploy.sh > deploy.runtime.sh
    - chmod 700 deploy.runtime.sh
    - DEPLOY_RUNTIME=docker-compose DEPLOY_SOURCE_DIR=../.. FRP_SERVER_BIN="${FRP_SERVER_BIN:-}" FRP_CLIENT_BIN="${FRP_CLIENT_BIN:-}" ./deploy.runtime.sh
    - chmod 700 publish-deployments.sh
    - OCUSPOT_IMAGE_REF="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}" ./publish-deployments.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .ocuspot/deploy/
